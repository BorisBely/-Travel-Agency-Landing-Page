<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Travel Agency</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="css/reset.css" />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <section class="hero">
      <header class="header">
        <div class="container header__content">
          <div class="header__logo">
            <img src="resources/LogoTravellian.svg" alt="Travellian logo" />
          </div>
          <!-- Navigation -->
          <nav class="nav">
            <a href="#" class="nav__link">Home</a>
            <a href="#" class="nav__link">Explore</a>
            <a href="#" class="nav__link">Travel</a>
            <a href="#" class="nav__link">Blog</a>
            <a href="#" class="nav__link">Pricing</a>
          </nav>
          <!-- Actions -->
          <div class="header__actions">
            <a href="#" class="header__login">Login</a>
            <button class="btn btn--primary">Sign Up</button>
          </div>
        </div>
      </header>
      <!-- HERO CONTENT -->
      <div class="container hero__content">
        <h1 class="hero__title">Discover the World</h1>
        <p class="hero__text">
          Plan your perfect journey with our travel experts and explore amazing
          destinations.
        </p>
      </div>
    </section>
  </body>
</html>
