<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Travel Agency</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="stylesheet" href="css/reset.css" />
    <link rel="stylesheet" href="css/style.css" />
  </head>

  <body>
    <!-- HERO -->
    <section class="hero">
      <header class="header">
        <div class="container header__content">
          <!-- Logo -->
          <div class="header__logo">
            <img src="resources/LogoTravellian.svg" alt="Travellian logo" />
          </div>

          <!-- Navigation -->
          <nav class="nav" id="nav">
            <a href="#" class="nav__link">Home</a>
            <a href="#" class="nav__link">Explore</a>
            <a href="#" class="nav__link">Travel</a>
            <a href="#" class="nav__link">Blog</a>
            <a href="#" class="nav__link">Pricing</a>
          </nav>

          <!-- Burger -->
          <button class="burger" id="burger">
            <span></span>
            <span></span>
            <span></span>
          </button>

          <!-- Actions -->
          <div class="header__actions">
            <a href="#" class="header__login">Login</a>
            <button class="btn btn--primary">Sign Up</button>
          </div>
        </div>
      </header>

      <!-- Hero content -->
      <div class="container hero__content">
        <h1 class="hero__title">Start your unforgettable journey with us.</h1>
        <p class="hero__text">The best travel for your journey begins now</p>

        <!-- BOOKING PANEL -->
        <form class="booking">
          <div class="booking__item">
            <label class="booking__label">Destination</label>
            <select class="booking__input">
              <option>Choose a destination</option>
              <option>Berlin</option>
              <option>London</option>
              <option>Lisbon</option>
              <option>Venice</option>
            </select>
          </div>

          <div class="booking__item">
            <label class="booking__label">People</label>
            <select class="booking__input">
              <option>Choose an option</option>
              <option>1</option>
              <option>2</option>
              <option>3</option>
              <option>4+</option>
            </select>
          </div>

          <div class="booking__item">
            <label class="booking__label">Check in</label>
            <input type="date" class="booking__input" />
          </div>

          <div class="booking__item">
            <label class="booking__label">Check out</label>
            <input type="date" class="booking__input" />
          </div>

          <button class="booking__button">Book Now</button>
        </form>
    </section>

    <!-- POPULAR DESTINATIONS -->
    <section class="destinations">
      <div class="container">
        <h2 class="destinations__title">Popular Destinations</h2>
        <div class="destinations__divider"></div>
        <p class="destinations__subtitle">
          Most popular destinations around the world, from historical places to
          natural wonders.
        </p>
        <div class="destinations__slider">
          <button class="slider__btn slider__btn--left" id="slideLeft">&#10094;</button>
          <div class="destinations__viewport">
             <div class="destinations__cards">
              <div class="destination-card">
                 <img src="resources/Berlin.webp" alt="Berlin" />
              </div>
              <div class="destination-card">
                 <img src="resources/London.webp" alt="London" />
              </div>
              <div class="destination-card">
                 <img src="resources/Lisbon.webp" alt="Lisbon" />
              </div>
              <div class="destination-card">
                 <img src="resources/Venice.webp" alt="Venice" />
              </div>
             </div>
          </div>
          <button class="slider__btn slider__btn--right" id="slideRight">&#10095;</button>
        </div>
      </div>
    </section>

    <script src="js/menu.js"></script>
    <script src="js/slider.js"></script>

  </body>
</html>
